<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="830" height="258" viewBox="0 0 830 258" role="img" aria-label="Electrocart logo">
	<defs>
		<linearGradient id="g1" x1="0" x2="1">
			<stop offset="0" stop-color="#2563EB" />
			<stop offset="1" stop-color="#06B6D4" />
		</linearGradient>
	</defs>
	<!-- Background transparent -->
	<rect width="830" height="258" fill="none"/>

	<!-- Icon: rounded square with stylized 'E' and lightning accent -->
	<g transform="translate(40,30)">
		<rect x="0" y="0" width="140" height="140" rx="20" fill="url(#g1)" />
		<!-- stylized E (three white bars) -->
		<rect x="30" y="30" width="80" height="14" rx="6" fill="#fff" />
		<rect x="30" y="58" width="60" height="14" rx="6" fill="#fff" />
		<rect x="30" y="86" width="80" height="14" rx="6" fill="#fff" />
		<!-- lightning bolt accent (orange) -->
		<polygon points="100,18 84,66 110,66 78,122 110,78 92,78 120,18" fill="#FB923C" opacity="0.95" transform="translate(-8,-4) scale(0.8)"/>
	</g>

	<!-- Wordmark -->
	<g transform="translate(210,120)">
		<text x="0" y="0" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="48" fill="#0F172A">Electrocart</text>
		<text x="0" y="44" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="16" fill="#475569">Electronics & Accessories</text>
	</g>

	<!-- Fallback small icon for favicon rendering in some browsers -->
	<g id="mini" transform="translate(640,20) scale(0.6)">
		<rect x="0" y="0" width="120" height="120" rx="18" fill="#2563EB"/>
		<path d="M28 36h56v12H28zM28 60h36v12H28zM28 84h56v12H28z" fill="#fff"/>
	</g>
</svg>
